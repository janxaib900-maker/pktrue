<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Download App</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 0 16px 40px;
      background: #f0f1f4;
      color: #111;
      font-family: Arial, Helvetica, sans-serif;
    }
    .page {
      width: min(100%, 576px);
      margin: 0 auto;
    }
    .video-shell {
      height: min(56vw, 322px);
      min-height: 250px;
      background: #000;
      border-radius: 0 0 15px 15px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
    .download {
      display: block;
      width: 100%;
      margin: 7px 0 8px;
      padding: 15px 12px;
      border: 2px solid #111;
      border-radius: 14px;
      background: #12bd70;
      color: white;
      text-align: center;
      text-decoration: none;
      font-size: 16px;
      font-weight: 700;
    }
    .info {
      padding: 16px 13px 12px;
      background: #fff;
      border: 1px solid #d7dce5;
      border-radius: 13px;
      text-align: center;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 16px;
      font-weight: 700;
    }
    .instruction {
      margin: 0 0 16px;
      font-size: 14px;
    }
    .hint {
      margin: 0 0 14px;
      color: #7183aa;
      font-size: 12px;
      line-height: 1.5;
    }
    .sound {
      width: 100%;
      min-height: 48px;
      border: 1px solid #d7dce5;
      border-radius: 13px;
      background: #fafafa;
      color: #111;
      font-size: 14px;
      cursor: pointer;
    }
    .footnote {
      margin: 14px 0 0;
      color: #7183aa;
      font-size: 11px;
    }
    @media (max-width: 480px) {
      body { padding-left: 10px; padding-right: 10px; }
      .video-shell { height: 58vh; min-height: 230px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="video-shell">
      <video id="demoVideo" autoplay muted playsinline loop controls>
        <source src="video.mp4" type="video/mp4">
        Your browser does not support HTML video.
      </video>
    </div>

    <a class="download" href="https://getblock.me/?uid=33949975" target="_blank" rel="noopener">
      Download App
    </a>

    <section class="info">
      <h1>App install kar lein</h1>
      <p class="instruction">Upar "Download App" par click karein.</p>
      <p class="hint">Barah-e-karam video mukammal dekhein. App ki tamam details video mein di gayi hain.</p>
      <button class="sound" id="soundButton" type="button">▶ Play video with sound</button>
      <p class="footnote">Sound autoplay browser ki settings ki wajah se block ho sakta hai.</p>
    </section>
  </main>

  <script>
    const video = document.getElementById('demoVideo');
    const soundButton = document.getElementById('soundButton');

    // Start playback automatically where the browser permits it.
    video.muted = true;
    video.play().catch(() => {});

    soundButton.addEventListener('click', async () => {
      video.muted = false;
      video.volume = 1;
      try {
        await video.play();
        soundButton.textContent = '🔊 Sound on';
      } catch (error) {
        soundButton.textContent = 'Tap the video to play';
      }
    });
  </script>
</body>
</html>
